name: Vérification des liens
on:
  schedule:
    - cron: "23 4 1 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/liens.yml", ".github/scripts/liens.py", "liens/demande.txt"]
permissions:
  contents: write
concurrency: liens
jobs:
  liens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p liens && python3 .github/scripts/liens.py
      - run: |
          git config user.name "Verif liens"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add liens
          git diff --cached --quiet || (git commit -m "Vérification des liens du $(date -u +%F)" && git pull --rebase && git push)
