<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Oz (et sa RUIN'E) – produit</title>
<script>window.goatcounter={no_onload:true}</script>
<script data-goatcounter="https://ozetsaruine.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script src="liens.js"></script>
<style>html,body{margin:0;background:#fff}</style></head>
<body>
<script>
(function(){
  var q=new URLSearchParams(location.search),id=q.get("p")||"",src=q.get("s")||"",L=window.LIENS||{},e=L[id];
  if(!e){location.replace("https://ozetsaruine.github.io/");return}   /* produit inconnu : le site */
  var url=e.u,ua=navigator.userAgent||"";
  var app=/Instagram|FBAN|FBAV|FB_IAB/i.test(ua),android=/Android/i.test(ua),ios=/iPhone|iPad|iPod/i.test(ua);
  var ref=src||(app?(/Instagram/i.test(ua)?"instagram":"facebook"):(document.referrer||""));
  (function compte(n){var g=window.goatcounter;if(g&&g.count){g.count({path:"go-"+id,title:"Lien court : "+e.n,referrer:ref});g.count({path:"item-"+id,title:e.n,event:true})}else if(n<15)setTimeout(function(){compte(n+1)},200)})(0);
  function go(){
    if(app&&android){var u=new URL(url);location.href="intent://"+u.host+u.pathname+u.search+u.hash+"#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url="+encodeURIComponent(url)+";end"}
    else if(app&&ios){location.href="x-safari-"+url}
    else location.replace(url);
  }
  setTimeout(go,350);
})();
</script></body></html>
